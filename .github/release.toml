version = 1

[python]
version = "3.14"

[validation]
checks = ["ruff", "ruff-format", "mypy", "pytest", "pytest-coverage", "docker-compose", "pre-commit"]

[coverage]
target = "events_service"

[build]
python_package = true

[container]
publish = true
image_name = "events-service"

[runtime]
validation = true
check_module = "events_service.runtime_check"
timeout_seconds = 120

[release]
semantic_release = true
