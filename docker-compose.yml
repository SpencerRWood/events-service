services:
  wood-broker:
    build:
      context: .
    command: uvicorn services.broker.app.main:create_runtime_app --factory --host 0.0.0.0 --port 8000
    environment:
      BROKER_HOST: 0.0.0.0
      BROKER_PORT: 8000
      BROKER_DATABASE_URL: ${WOOD_EVENTS_DATABASE_URL:?Set WOOD_EVENTS_DATABASE_URL to your centralized PostgreSQL URL}
    ports:
      - "8001:8000"
    networks:
      - wood-events-internal

  wood-notify:
    build:
      context: .
    command: uvicorn services.notify.app.main:create_runtime_app --factory --host 0.0.0.0 --port 8000
    environment:
      NOTIFY_HOST: 0.0.0.0
      NOTIFY_PORT: 8000
      NOTIFY_DATABASE_URL: ${WOOD_EVENTS_DATABASE_URL:?Set WOOD_EVENTS_DATABASE_URL to your centralized PostgreSQL URL}
      NTFY_BASE_URL: http://ntfy:80
    ports:
      - "8002:8000"
    depends_on:
      - ntfy
    networks:
      - wood-events-internal

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    networks:
      - wood-events-internal

networks:
  wood-events-internal:
    driver: bridge
