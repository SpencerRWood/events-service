services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wes_dev
      POSTGRES_DB: wes_dev
      POSTGRES_PASSWORD: ${WES_LOCAL_POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wes_dev -d wes_dev"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  migrate:
    build:
      context: .
    command: ["python", "-m", "wood_events_service.migrate"]
    environment:
      WES_DATABASE_URL: postgresql+psycopg://wes_dev:${WES_LOCAL_POSTGRES_PASSWORD:-local-development-only}@postgres/wes_dev
    depends_on:
      postgres:
        condition: service_healthy
  broker:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment: &runtime
      WES_DATABASE_URL: postgresql+psycopg://wes_dev:${WES_LOCAL_POSTGRES_PASSWORD:-local-development-only}@postgres/wes_dev
      WES_PRODUCER_CREDENTIALS: ${WES_PRODUCER_CREDENTIALS:-[]}
    depends_on:
      migrate:
        condition: service_completed_successfully
  notify:
    build:
      context: .
    command: ["uvicorn", "wood_events_service.notify:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8001:8000"
    environment: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
